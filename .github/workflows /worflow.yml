name: Build MP4-MP3 Converter EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller moviepy pydub

    - name: Build EXE
      run: |
        pyinstaller --onefile mp4-mp3.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mp4-mp3-executable
        path: dist/mp4-mp3.exe
